<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glow.iq | You deserve to glow</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#fff;color:#29202d;font-family:Arial,sans-serif}

header{text-align:center;padding:18px;background:#f0eafa}

header h1{font-family:Georgia,serif;font-size:35px;margin:5px}

header p{font-family:Georgia,serif}

.design{width:100%;display:block;height:auto}

h2{text-align:center;color:#65466f;margin:35px 0 20px}

.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:12px}

.product{border:1px solid #e6ddec;border-radius:12px;padding:10px;text-align:center}

.product img{width:100%;height:145px;object-fit:contain;background:#faf8fc}

.product h3{font-size:15px}

.price{color:#78538a;font-weight:bold}

button{background:#77558b;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}

.cart{margin:15px;padding:18px;background:#f1ebf7;border-radius:12px}

input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #d8c9df;border-radius:8px}

footer{text-align:center;padding:25px;background:#eee6f4;margin-top:30px}

</style>

</head>

<body>

<header>

<h1>Glow store</h1>

<p>You deserve to glow</p>

</header>

<!-- التصميم الأصلي يوضع هنا باسم design.webp -->

<img class="design" src="design.webp" alt="Glow store original design">

<h2>Our Products | منتجاتنا</h2>

<div class="products" id="products"></div>

<div class="cart">

<h2>سلة المشتريات 🛍️</h2>

<div id="cartItems">السلة فارغة</div>

<p>المجموع: <strong id="total">0</strong> IQD</p>

<h2>إكمال الطلب</h2>

<input id="customer" placeholder="الاسم الكامل">

<input id="phone" placeholder="رقم الهاتف">

<input id="address" placeholder="العنوان والمحافظة">

<textarea id="notes" placeholder="ملاحظات إضافية"></textarea>

<button onclick="sendOrder()">إرسال الطلب</button>

</div>

<footer>

Glow.iq — You deserve to glow ♡

</footer>

<script>

const products=[

{name:"Skin1004 Centella Ampoule",price:25000},

{name:"The Ordinary Serum",price:18000},

{name:"Laneige Lip Mask",price:22000},

{name:"Too Faced Mascara",price:35000},

{name:"Vanilla Skin Perfume",price:45000},

{name:"Skincare Set",price:30000}

];

let cart=[];

function showProducts(){

document.getElementById("products").innerHTML=products.map((p,i)=>`

<div class="product">

<div style="height:145px;display:grid;place-items:center;background:#faf8fc;color:#b49ac4;font-size:40px">♡</div>

<h3>${p.name}</h3>

<p class="price">${p.price.toLocaleString()} IQD</p>

<button onclick="add(${i})">أضيفي للسلة</button>

</div>`).join("");

}

function add(i){

cart.push(products[i]);

showCart();

}

function showCart(){

document.getElementById("cartItems").innerHTML=cart.length

?cart.map((p,i)=>`<p>${p.name} — ${p.price.toLocaleString()} IQD <button onclick="removeItem(${i})">حذف</button></p>`).join("")

:"السلة فارغة";

document.getElementById("total").textContent=

cart.reduce((s,p)=>s+p.price,0).toLocaleString();

}

function removeItem(i){

cart.splice(i,1);

showCart();

}

function sendOrder(){

if(!cart.length)return alert("السلة فارغة");

const name=document.getElementById("customer").value.trim();

const phone=document.getElementById("phone").value.trim();

const address=document.getElementById("address").value.trim();

if(!name||!phone||!address)return alert("يرجى إكمال معلومات الطلب");

const message=

`طلب جديد من Glow.iq\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nالمنتجات:\n`+

cart.map(p=>`${p.name} - ${p.price} IQD`).join("\n")+

`\n\nالمجموع: ${cart.reduce((s,p)=>s+p.price,0)} IQD`;

navigator.clipboard.writeText(message).then(()=>{

alert("تم نسخ تفاصيل الطلب. افتحي حساب المتجر على إنستغرام والصقي الرسالة.");

window.open("https://www.instagram.com/glow.iq/","_blank");

}).catch(()=>{

alert("تعذر النسخ تلقائياً. جربي من متصفح Safari.");

});

}

showProducts();

showCart();

</script>

</body>

</html>
